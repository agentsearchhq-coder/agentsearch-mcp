# Smithery start command for a self-hosted AgentSearch-compatible API.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - agentsearchBaseUrl
    properties:
      agentsearchBaseUrl:
        type: string
        description: Base URL of your self-hosted AgentSearch API (no trailing slash). Required.
      agentsearchApiKey:
        type: string
        description: Optional Bearer token for your AgentSearch API
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        AGENTSEARCH_BASE_URL: config.agentsearchBaseUrl,
        ...(config.agentsearchApiKey
          ? { AGENTSEARCH_API_KEY: config.agentsearchApiKey }
          : {})
      }
    })
