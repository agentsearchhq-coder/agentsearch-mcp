# Smithery start command. Review tools and free search work with no config. With a wallet key, extract ($0.002) and render
# ($0.005) pay per call in USDC on Base over x402 to AgentSearch's own API (search pays $0.003 too unless searchMode is free; paymentRoute=pocket uses the Pocket portal at $0.005),
# or use your self-hosted API when a base URL is set.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      walletPrivateKey:
        type: string
        description: Optional 64-hex private key of a NEW wallet holding a little USDC on Base. Enables paid search/extract/render via x402 (search $0.003, extract $0.002, render $0.005, paid to AgentSearch); set searchMode to free to keep search free. Used only to sign payments.
      maxTotalAtomic:
        type: string
        default: "1000000"
        description: Session spend cap in USDC atomic units (1000000 = $1.00). Per-call payments are always capped at 20000 ($0.020).
      searchMode:
        type: string
        default: auto
        description: "Search only: auto (default; pay $0.003 per search when a wallet key is set, else free), free (free even with a wallet key) or paid (always pay; needs a wallet key)."
      paymentRoute:
        type: string
        default: direct
        description: "Paid route: direct (default; AgentSearch's own x402 API on Base) or pocket (Pocket Network Agentic Portal, $0.005 per call)."
      agentsearchBaseUrl:
        type: string
        description: Optional base URL of your self-hosted AgentSearch API (no trailing slash). When set, it is used instead of the paid portal.
      agentsearchApiKey:
        type: string
        description: Optional Bearer token for your self-hosted AgentSearch API
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        ...(config.walletPrivateKey
          ? { AGENTSEARCH_WALLET_PRIVATE_KEY: config.walletPrivateKey }
          : {}),
        ...(config.maxTotalAtomic
          ? { AGENTSEARCH_MAX_TOTAL_ATOMIC: config.maxTotalAtomic }
          : {}),
        ...(config.searchMode
          ? { AGENTSEARCH_MODE: config.searchMode }
          : {}),
        ...(config.paymentRoute
          ? { AGENTSEARCH_PAYMENT_ROUTE: config.paymentRoute }
          : {}),
        ...(config.agentsearchBaseUrl
          ? { AGENTSEARCH_BASE_URL: config.agentsearchBaseUrl }
          : {}),
        ...(config.agentsearchApiKey
          ? { AGENTSEARCH_API_KEY: config.agentsearchApiKey }
          : {})
      }
    })
