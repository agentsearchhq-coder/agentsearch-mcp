# Smithery start command. Review tools work with no config; set the base URL to enable search/extract/render.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      agentsearchBaseUrl:
        type: string
        description: Optional base URL of your self-hosted AgentSearch API (no trailing slash). Needed only for search/extract/render; the review tools work without it.
      agentsearchApiKey:
        type: string
        description: Optional Bearer token for your AgentSearch API
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        ...(config.agentsearchBaseUrl
          ? { AGENTSEARCH_BASE_URL: config.agentsearchBaseUrl }
          : {}),
        ...(config.agentsearchApiKey
          ? { AGENTSEARCH_API_KEY: config.agentsearchApiKey }
          : {})
      }
    })
